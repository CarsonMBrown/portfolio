# Site settings
title: Carson Brown
email: "carson.mattox@gmail.com"
description: "Real World Portfolio"
url: "https://carsonmbrown.github.io"
baseurl: "/portfolio"
github_username:  "CarsonMBrown"
linkedin_username:  "carson-m-brown"
share: false

# Owner/author information
owner:
  name:   Portfolio
  avatar: avatar.png
  favicon: favicon.ico
  info: portfolio site

# Settings for comments helper
# Set 'provider' to the comment provider you want to use. (i.e.  Disqus, Intense Debate, livefyre, or Facebook Comments)
# Set 'provider' to false to turn commenting off globally.
#Set 'provider: false' to disable comments globally.
# Disable comments for individual pages/posts by specifying 'comments: false' in the page/post YAML Front Matter.
#
comments :
  provider : false
  disqus :
    short_name : ""

# Internal nav
nav:
  - GALLERY: "https://carsonmbrown.github.io/portfolio/gallery/"  
  - JOURNAL: "https://carsonmbrown.github.io/portfolio/journal/"
  - ABOUT: "https://carsonmbrown.github.io/portfolio/about/"

# All translation keys
translations:
 # 404.html
  permalink: "/404.html"

# Server
destination:      	 ./_site
port:             	 4000


# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
paginate: 5
paginate_path: "/journal/page:num/"
permalink: "/journal/:title/"
categories_path: "/journal/category/"
tags_path: "/journal/tag/"
gems: 
 - jekyll-paginate
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md"]

# SiteMap
sitemap:
    file: "/sitemap.xml"
    exclude:
        - "/atom.xml"
        - "/feed.xml"
        - "/feed/index.xml"
    include_posts:
        - "/writing/"
    change_frequency_name: "change_frequency"
    priority_name: "priority"
